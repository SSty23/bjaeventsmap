<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>British Judo Events Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0300bd;
      border-bottom: 1px solid #ddd;
      padding: 12px 18px;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      color: #fff;
    }

    #status {
      margin-top: 4px;
      font-size: 14px;
      color: #666;
    }

    #app {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* --------------------------------------------
       SIDEBAR
    -------------------------------------------- */

    #sidebar {
      width: 360px;
      min-width: 320px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    #filters {
      padding: 14px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    .filter-group {
      margin-bottom: 10px;
    }

    .filter-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #444;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      font-size: 14px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #resetFilters {
      width: 100%;
      border: 1px solid #bbb;
      background: #fff;
      padding: 9px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    #resetFilters:hover {
      background: #f1f1f1;
    }

    #resultCount {
      padding: 10px 14px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      font-size: 14px;
      line-height: 1.4;
    }

    #eventList {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .event-item {
      padding: 13px 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      background: #fff;
    }

    .event-item:hover {
      background: #f5f7fa;
    }

    .event-item.selected {
      background: #eef5ff;
    }

    .event-date {
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }

    .event-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .event-location {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    .event-categories {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .event-category {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      background: #eef3f8;
      color: #445;
      font-size: 11px;
    }

    .no-events {
      padding: 20px 14px;
      color: #777;
      text-align: center;
    }

    /* --------------------------------------------
       MAP
    -------------------------------------------- */

    #map {
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    .maplibregl-popup-content {
      padding: 14px;
      width: 310px;
      max-width: 310px;
      max-height: 420px;
      overflow-y: auto;
    }

    .venue-popup-title {
      margin: 0 0 5px 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .venue-popup-location {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #666;
    }

    .venue-popup-count {
      margin: 0 0 10px 0;
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }

    .popup-event {
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    .popup-event:first-of-type {
      border-top: 0;
    }

    .popup-event-date {
      font-size: 12px;
      color: #555;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .popup-event-title {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.3;
    }

    .popup-event-cost {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .popup-categories {
      margin-top: 5px;
    }

    .popup-category {
      display: inline-block;
      padding: 3px 5px;
      margin: 2px 2px 2px 0;
      border-radius: 4px;
      background: #eef3f8;
      color: #445;
      font-size: 10px;
    }

    .popup-event a {
      display: inline-block;
      margin-top: 7px;
      padding: 6px 8px;
      background: #0d47a1;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .popup-event a:hover {
      background: #083574;
    }

    /* --------------------------------------------
       MOBILE
    -------------------------------------------- */

    @media (max-width: 750px) {
      #app {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        min-width: 0;
        height: 42%;
        border-right: 0;
        border-bottom: 1px solid #ddd;
      }

      #map {
        height: 58%;
      }

      header h1 {
        font-size: 18px;
      }

      .maplibregl-popup-content {
        width: 270px;
        max-width: 270px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>British Judo Events Map 1.4</h1>

    <div id="status">
      Loading events...
    </div>
  </header>


  <div id="app">

    <aside id="sidebar">

      <div id="filters">

        <div class="filter-group">

          <label for="search">
            Search events or locations
          </label>

          <input
            id="search"
            type="search"
            placeholder="e.g. Cardiff, grading, coaching..."
          />

        </div>


        <div class="filter-group">

          <label for="categoryFilter">
            Event type
          </label>

          <select id="categoryFilter">

            <option value="">
              All event types
            </option>

          </select>

        </div>


        <div class="date-row">

          <div class="filter-group">

            <label for="fromDate">
              From
            </label>

            <input
              id="fromDate"
              type="date"
            />

          </div>


          <div class="filter-group">

            <label for="toDate">
              To
            </label>

            <input
              id="toDate"
              type="date"
            />

          </div>

        </div>


        <button
          id="resetFilters"
          type="button"
        >
          Reset filters
        </button>

      </div>


      <div id="resultCount">
        Loading...
      </div>


      <div id="eventList"></div>

    </aside>


    <div id="map"></div>

  </div>


  <script type="module">

    import * as maplibregl
      from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";


    /* ====================================================
       CONFIG
    ==================================================== */

    const API_URL =
      "https://bja-events-sync.spencer-stylianides.workers.dev/api/events";


    const UK_BOUNDS = [
      [-8.8, 49.8],
      [2.2, 60.9]
    ];


    /* ====================================================
       STATE
    ==================================================== */

    let allEvents = [];

    /*
     * Events matching search/category/date filters.
     *
     * These remain on the map even if currently outside
     * the visible map viewport.
     */
    let filteredEvents = [];


    /*
     * Event currently selected from the sidebar.
     */
    let selectedEventId = null;


    let activePopup = null;


    /* ====================================================
       MAP
    ==================================================== */

    const map = new maplibregl.Map({

      container:
        "map",

      style:
        "https://tiles.openfreemap.org/styles/liberty",

      bounds:
        UK_BOUNDS,

      fitBoundsOptions: {
        padding: 30
      },

      renderWorldCopies:
        false,

      fadeDuration:
        0

    });


    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );


    /* ====================================================
       LOAD EVENTS
    ==================================================== */

    async function loadEvents() {

      const response =
        await fetch(API_URL);


      if (!response.ok) {

        throw new Error(
          `API returned HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      allEvents =
        data.events
          .map(event => {

            const longitude =
              Number(event.longitude);

            const latitude =
              Number(event.latitude);


            if (
              !Number.isFinite(longitude) ||
              !Number.isFinite(latitude)
            ) {

              return null;

            }


            let categories =
              event.categories ?? [];


            if (
              typeof categories === "string"
            ) {

              try {

                categories =
                  JSON.parse(categories);

              }
              catch {

                categories = [];

              }

            }


            if (
              !Array.isArray(categories)
            ) {

              categories = [];

            }


            return {

              ...event,

              longitude,
              latitude,
              categories

            };

          })
          .filter(Boolean);


      allEvents.sort(
        (a, b) =>
          parseEventDate(a.start_datetime) -
          parseEventDate(b.start_datetime)
      );


      populateCategoryFilter();

      setupEventSource();

      applyFilters();


      document
        .getElementById("status")
        .textContent =
          `${allEvents.length} events loaded`;

    }


    /* ====================================================
       CATEGORY FILTER
    ==================================================== */

    function populateCategoryFilter() {

      const select =
        document.getElementById(
          "categoryFilter"
        );


      const categoryMap =
        new Map();


      for (const event of allEvents) {

        for (
          const category of
          event.categories ?? []
        ) {

          if (
            category.slug &&
            category.name
          ) {

            categoryMap.set(
              category.slug,
              category.name
            );

          }

        }

      }


      const categories =
        Array.from(
          categoryMap.entries()
        )
          .sort(
            (a, b) =>
              a[1].localeCompare(
                b[1]
              )
          );


      select.innerHTML = `
        <option value="">
          All event types
        </option>
      `;


      for (
        const [slug, name]
        of categories
      ) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          slug;

        option.textContent =
          name;

        select.appendChild(
          option
        );

      }

    }


    /* ====================================================
       GEOJSON
    ==================================================== */

    function eventsToGeoJSON(events) {

      return {

        type:
          "FeatureCollection",

        features:
          events.map(event => ({

            type:
              "Feature",

            geometry: {

              type:
                "Point",

              coordinates: [
                event.longitude,
                event.latitude
              ]

            },

            properties: {

              id:
                event.id,

              title:
                event.title ?? "",

              venue_name:
                event.venue_name ?? ""

            }

          }))

      };

    }


    /* ====================================================
       MAP SOURCE / CLUSTERS
    ==================================================== */

    function setupEventSource() {

      map.addSource(
        "events",
        {

          type:
            "geojson",

          data:
            eventsToGeoJSON(allEvents),

          cluster:
            true,

          clusterMaxZoom:
            14,

          clusterRadius:
            50

        }
      );


      map.addLayer({

        id:
          "clusters",

        type:
          "circle",

        source:
          "events",

        filter:
          ["has", "point_count"],

        paint: {

          "circle-color": [

            "step",

            ["get", "point_count"],

            "#1976d2",

            10,
            "#1565c0",

            25,
            "#0d47a1"

          ],

          "circle-radius": [

            "step",

            ["get", "point_count"],

            18,

            10,
            22,

            25,
            27,

            50,
            32

          ],

          "circle-stroke-width":
            2,

          "circle-stroke-color":
            "#ffffff"

        }

      });


      map.addLayer({

        id:
          "cluster-count",

        type:
          "symbol",

        source:
          "events",

        filter:
          ["has", "point_count"],

        layout: {

          "text-field":
            "{point_count_abbreviated}",

          "text-font": [
            "Noto Sans Regular"
          ],

          "text-size":
            13,

          "text-allow-overlap":
            true

        },

        paint: {

          "text-color":
            "#ffffff"

        }

      });
      map.addLayer({

        id:
          "unclustered-point",

        type:
          "circle",

        source:
          "events",

        filter: [
          "!",
          ["has", "point_count"]
        ],

        paint: {

          "circle-color":
            "#e53935",

          "circle-radius":
            10,

          "circle-stroke-width":
            2,

          "circle-stroke-color":
            "#ffffff"

        }

      });

    }


    /* ====================================================
       FILTERING
    ==================================================== */

    function applyFilters() {

      const search =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();


      const category =
        document
          .getElementById(
            "categoryFilter"
          )
          .value;


      const fromDate =
        document
          .getElementById("fromDate")
          .value;


      const toDate =
        document
          .getElementById("toDate")
          .value;


      filteredEvents =
        allEvents.filter(event => {

          const searchableText = [

            event.title,
            event.venue_name,
            event.city,
            event.postcode

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


          if (
            search &&
            !searchableText.includes(search)
          ) {

            return false;

          }


          if (category) {

            const hasCategory =
              (event.categories ?? [])
                .some(
                  item =>
                    item.slug === category
                );


            if (!hasCategory) {

              return false;

            }

          }


          const eventDate =
            getDatePart(
              event.start_datetime
            );


          if (
            fromDate &&
            eventDate < fromDate
          ) {

            return false;

          }


          if (
            toDate &&
            eventDate > toDate
          ) {

            return false;

          }


          return true;

        });


      updateMap();

      renderEventList();

    }


    /* ====================================================
       UPDATE MAP
    ==================================================== */

    function updateMap() {

      const source =
        map.getSource("events");


      if (!source) {

        return;

      }


      source.setData(
        eventsToGeoJSON(
          filteredEvents
        )
      );

    }


    /* ====================================================
       EVENTS CURRENTLY INSIDE MAP VIEW
    ==================================================== */

    function getVisibleEvents() {

      if (!map.loaded()) {

        return filteredEvents;

      }


      const bounds =
        map.getBounds();


      return filteredEvents.filter(
        event =>
          bounds.contains([
            event.longitude,
            event.latitude
          ])
      );

    }


    /* ====================================================
       SIDEBAR
    ==================================================== */

    function renderEventList() {

      const container =
        document.getElementById(
          "eventList"
        );


      const visibleEvents =
        getVisibleEvents();


      document
        .getElementById("resultCount")
        .textContent =
          `${visibleEvents.length} ${
            visibleEvents.length === 1
              ? "event"
              : "events"
          } in this map area` +
          (
            visibleEvents.length !==
            filteredEvents.length

              ? ` · ${filteredEvents.length} matching filters`

              : ""
          );


      container.innerHTML = "";


      if (
        visibleEvents.length === 0
      ) {

        container.innerHTML = `
          <div class="no-events">
            No events are visible in this map area.
          </div>
        `;

        return;

      }


      for (
        const event of visibleEvents
      ) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "event-item";


        if (
          String(event.id) ===
          String(selectedEventId)
        ) {

          item.classList.add(
            "selected"
          );

        }


        item.dataset.eventId =
          event.id;


        let categoriesHtml = "";


        if (
          event.categories?.length
        ) {

          categoriesHtml = `

            <div class="event-categories">

              ${
                event.categories
                  .map(
                    category => `
                      <span class="event-category">
                        ${escapeHtml(
                          category.name
                        )}
                      </span>
                    `
                  )
                  .join("")
              }

            </div>

          `;

        }


        item.innerHTML = `

          <div class="event-date">

            ${escapeHtml(
              formatEventDate(
                event.start_datetime
              )
            )}

          </div>


          <div class="event-title">

            ${escapeHtml(
              event.title
            )}

          </div>


          <div class="event-location">

            ${
              event.venue_name
                ? escapeHtml(
                    event.venue_name
                  )
                : ""
            }


            ${
              event.city
                ? `<br>${escapeHtml(
                    event.city
                  )}`
                : ""
            }


            ${
              event.postcode
                ? ` ${escapeHtml(
                    event.postcode
                  )}`
                : ""
            }

          </div>


          ${categoriesHtml}

        `;


        item.addEventListener(
          "click",
          () => {

            selectEvent(event);

          }
        );


        container.appendChild(
          item
        );

      }

    }


    /* ====================================================
       EVENTS AT SAME LOCATION
    ==================================================== */

    function getEventsAtLocation(
      longitude,
      latitude
    ) {

      /*
       * Use a small tolerance to avoid problems caused
       * by floating point precision.
       */

      const tolerance =
        0.000001;


      return filteredEvents.filter(
        event =>

          Math.abs(
            event.longitude -
            longitude
          ) < tolerance

          &&

          Math.abs(
            event.latitude -
            latitude
          ) < tolerance

      );

    }


    /* ====================================================
       SIDEBAR EVENT CLICK
    ==================================================== */

    function selectEvent(event) {

      selectedEventId =
        event.id;


      renderEventList();


      map.easeTo({

        center: [
          event.longitude,
          event.latitude
        ],

        zoom:
          Math.max(
            map.getZoom(),
            15
          ),

        duration:
          700

      });


      window.setTimeout(
        () => {

          const venueEvents =
            getEventsAtLocation(
              event.longitude,
              event.latitude
            );


          showLocationPopup(
            venueEvents,
            [
              event.longitude,
              event.latitude
            ]
          );

        },
        750
      );

    }


    /* ====================================================
       CLUSTER CLICK
    ==================================================== */

    map.on(
      "click",
      "clusters",
      async event => {

        const features =
          map.queryRenderedFeatures(
            event.point,
            {
              layers: [
                "clusters"
              ]
            }
          );


        if (!features.length) {

          return;

        }


        const cluster =
          features[0];


        const clusterId =
          cluster.properties
            .cluster_id;


        const source =
          map.getSource(
            "events"
          );


        const zoom =
          await source
            .getClusterExpansionZoom(
              clusterId
            );


        map.easeTo({

          center:
            cluster
              .geometry
              .coordinates,

          zoom

        });

      }
    );


    /* ====================================================
       RED MARKER CLICK
    ==================================================== */

map.on(
  "click",
  "unclustered-point",
  event => {
console.log("RED MARKER CLICK", event.features);
    const feature =
      event.features?.[0];

    if (!feature) {
      return;
    }

    const eventId =
      feature.properties.id;

    const clickedEvent =
      filteredEvents.find(
        item =>
          String(item.id) ===
          String(eventId)
      );

    if (!clickedEvent) {
      console.log(
        "Could not find clicked event:",
        eventId
      );

      return;
    }

    const venueEvents =
      getEventsAtLocation(
        clickedEvent.longitude,
        clickedEvent.latitude
      );

    selectedEventId =
      clickedEvent.id;

    renderEventList();

    showLocationPopup(
      venueEvents.length
        ? venueEvents
        : [clickedEvent],
      [
        clickedEvent.longitude,
        clickedEvent.latitude
      ]
    );

    scrollEventIntoView(
      clickedEvent.id
    );

  }
);


    /* ====================================================
       MULTI-EVENT LOCATION POPUP
    ==================================================== */

    function showLocationPopup(
      events,
      coordinates
    ) {

      if (
        !events ||
        events.length === 0
      ) {

        return;

      }


      if (activePopup) {

        activePopup.remove();

      }


      const sortedEvents =
        [...events]
          .sort(
            (a, b) =>
              parseEventDate(
                a.start_datetime
              ) -
              parseEventDate(
                b.start_datetime
              )
          );


      const firstEvent =
        sortedEvents[0];


      const venueName =
        firstEvent.venue_name ||
        "Event location";


      let locationText = "";


      if (firstEvent.city) {

        locationText +=
          firstEvent.city;

      }


      if (firstEvent.postcode) {

        if (locationText) {

          locationText +=
            " ";

        }

        locationText +=
          firstEvent.postcode;

      }


      const eventItemsHtml =
        sortedEvents
          .map(event => {

            let categoriesHtml = "";


            if (
              event.categories?.length
            ) {

              categoriesHtml = `

                <div class="popup-categories">

                  ${
                    event.categories
                      .map(
                        category => `
                          <span class="popup-category">
                            ${escapeHtml(
                              category.name
                            )}
                          </span>
                        `
                      )
                      .join("")
                  }

                </div>

              `;

            }


            let costHtml = "";


            if (event.cost_text) {

              costHtml = `

                <div class="popup-event-cost">

                  Cost:
                  ${escapeHtml(
                    event.cost_text
                  )}

                </div>

              `;

            }


            let linkHtml = "";


            if (event.bja_url) {

              linkHtml = `

                <a
                  href="${escapeAttribute(
                    event.bja_url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  View event
                </a>

              `;

            }


            return `

              <div class="popup-event">

                <div class="popup-event-date">

                  ${escapeHtml(
                    formatEventDate(
                      event.start_datetime
                    )
                  )}

                </div>


                <div class="popup-event-title">

                  ${escapeHtml(
                    event.title
                  )}

                </div>


                ${costHtml}

                ${categoriesHtml}

                ${linkHtml}

              </div>

            `;

          })
          .join("");


      const html = `

        <div class="venue-popup">

          <h3 class="venue-popup-title">

            ${escapeHtml(
              venueName
            )}

          </h3>


          ${
            locationText
              ? `
                <div class="venue-popup-location">

                  ${escapeHtml(
                    locationText
                  )}

                </div>
              `
              : ""
          }


          <div class="venue-popup-count">

            ${sortedEvents.length}
            ${
              sortedEvents.length === 1
                ? "event"
                : "events"
            }
            at this location

          </div>


          ${eventItemsHtml}

        </div>

      `;


      activePopup =
        new maplibregl.Popup({
          offset: 12
        })
          .setLngLat(
            coordinates
          )
          .setHTML(
            html
          )
          .addTo(
            map
          );

    }


    /* ====================================================
       SIDEBAR SCROLL
    ==================================================== */

    function scrollEventIntoView(
      eventId
    ) {

      const item =
        document.querySelector(
          `.event-item[data-event-id="${eventId}"]`
        );


      if (item) {

        item.scrollIntoView({

          behavior:
            "smooth",

          block:
            "nearest"

        });

      }

    }


    /* ====================================================
       MAP MOVEMENT
    ==================================================== */

    /*
     * Every time the map finishes moving, update
     * the sidebar so that it reflects the current
     * geographic area.
     *
     * This includes:
     *
     * - clicking a cluster
     * - zooming
     * - panning
     * - navigation controls
     */

    map.on(
      "moveend",
      () => {

        renderEventList();

      }
    );


    /* ====================================================
       FILTER EVENTS
    ==================================================== */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        applyFilters
      );


    document
      .getElementById(
        "categoryFilter"
      )
      .addEventListener(
        "change",
        applyFilters
      );


    document
      .getElementById("fromDate")
      .addEventListener(
        "change",
        applyFilters
      );


    document
      .getElementById("toDate")
      .addEventListener(
        "change",
        applyFilters
      );


    /* ====================================================
       RESET
    ==================================================== */

    document
      .getElementById(
        "resetFilters"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById(
              "search"
            )
            .value = "";


          document
            .getElementById(
              "categoryFilter"
            )
            .value = "";


          document
            .getElementById(
              "fromDate"
            )
            .value = "";


          document
            .getElementById(
              "toDate"
            )
            .value = "";


          selectedEventId =
            null;


          if (activePopup) {

            activePopup.remove();

            activePopup =
              null;

          }


          applyFilters();


          map.fitBounds(
            UK_BOUNDS,
            {
              padding: 30
            }
          );

        }
      );


    /* ====================================================
       POINTER CURSORS
    ==================================================== */

    map.on(
      "mouseenter",
      "clusters",
      () => {

        map.getCanvas()
          .style.cursor =
            "pointer";

      }
    );


    map.on(
      "mouseleave",
      "clusters",
      () => {

        map.getCanvas()
          .style.cursor =
            "";

      }
    );


    map.on(
      "mouseenter",
      "unclustered-point",
      () => {

        map.getCanvas()
          .style.cursor =
            "pointer";

      }
    );


    map.on(
      "mouseleave",
      "unclustered-point",
      () => {

        map.getCanvas()
          .style.cursor =
            "";

      }
    );


    /* ====================================================
       DATE HELPERS
    ==================================================== */

    function parseEventDate(value) {

      if (!value) {

        return 0;

      }


      const date =
        new Date(
          value.replace(
            " ",
            "T"
          )
        );


      return Number.isNaN(
        date.getTime()
      )
        ? 0
        : date.getTime();

    }


    function getDatePart(value) {

      if (!value) {

        return "";

      }


      return value.substring(
        0,
        10
      );

    }


    function formatEventDate(value) {

      if (!value) {

        return "Date unavailable";

      }


      const date =
        new Date(
          value.replace(
            " ",
            "T"
          )
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date
        .toLocaleDateString(
          "en-GB",
          {

            weekday:
              "short",

            day:
              "numeric",

            month:
              "short",

            year:
              "numeric"

          }
        );

    }


    /* ====================================================
       HTML ESCAPING
    ==================================================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );

    }


    /* ====================================================
       START
    ==================================================== */

    map.on(
      "load",
      async () => {

        try {

          await loadEvents();

        }
        catch (error) {

          console.error(
            "Could not load events:",
            error
          );


          document
            .getElementById(
              "status"
            )
            .textContent =
              "Could not load events.";


          document
            .getElementById(
              "resultCount"
            )
            .textContent =
              "Unable to load events";

        }

      }
    );

  </script>

</body>
</html>
