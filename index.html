<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>British Judo Events Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 12px 18px;
      border-bottom: 1px solid #dddddd;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #status {
      margin-top: 5px;
      font-size: 14px;
      color: #555555;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .maplibregl-popup-content {
      padding: 14px;
      max-width: 300px;
    }

    .event-popup h3 {
      margin: 0 0 10px 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .event-popup p {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .event-popup a {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .event-popup a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>British Judo Events Map</h1>

    <div id="status">
      Loading events...
    </div>
  </header>

  <div id="map"></div>

  <script type="module">

    import * as maplibregl
      from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";


    /*
     * ----------------------------------------------------
     * CONFIGURATION
     * ----------------------------------------------------
     */

    const API_URL =
      "https://bja-events-sync.spencer-stylianides.workers.dev/api/events";


    /*
     * ----------------------------------------------------
     * MAP
     * ----------------------------------------------------
     */

const UK_BOUNDS = [
  [-8.8, 49.8],
  [2.2, 60.9]
];

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",

  bounds: UK_BOUNDS,
  fitBoundsOptions: {
    padding: 30
  },
  renderWorldCopies: false,
  fadeDuration: 0
});

map.addControl(
  new maplibregl.NavigationControl(),
  "top-right"
);


    /*
     * ----------------------------------------------------
     * LOAD EVENTS
     * ----------------------------------------------------
     */

    async function loadEvents() {

      const status =
        document.getElementById("status");


      /*
       * Fetch events from Cloudflare Worker API
       */

      const response =
        await fetch(API_URL);


      if (!response.ok) {

        throw new Error(
          `API returned HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      /*
       * Convert API results into GeoJSON.
       *
       * MapLibre's built-in clustering works with
       * GeoJSON point features.
       */

      const features =
        data.events
          .map(event => {

            const longitude =
              Number(event.longitude);

            const latitude =
              Number(event.latitude);


            /*
             * Ignore events without usable coordinates
             */

            if (
              !Number.isFinite(longitude) ||
              !Number.isFinite(latitude)
            ) {

              return null;

            }


            return {

              type: "Feature",

              geometry: {

                type: "Point",

                coordinates: [
                  longitude,
                  latitude
                ]

              },

              properties: {

                id:
                  event.id,

                title:
                  event.title ?? "",

                start_datetime:
                  event.start_datetime ?? "",

                end_datetime:
                  event.end_datetime ?? "",

                venue_name:
                  event.venue_name ?? "",

                city:
                  event.city ?? "",

                postcode:
                  event.postcode ?? "",

                cost_text:
                  event.cost_text ?? "",

                bja_url:
                  event.bja_url ?? ""

              }

            };

          })
          .filter(Boolean);


      /*
       * GeoJSON FeatureCollection
       */

      const geojson = {

        type: "FeatureCollection",

        features:
          features

      };


      /*
       * ----------------------------------------------------
       * ADD CLUSTERED SOURCE
       * ----------------------------------------------------
       */

      map.addSource(
        "events",
        {

          type: "geojson",

          data:
            geojson,

          /*
           * Turn clustering on
           */

          cluster:
            true,

          /*
           * Stop clustering after zoom level 14
           */

          clusterMaxZoom:
            14,

          /*
           * Pixel radius used to decide which nearby
           * events should belong to the same cluster.
           */

          clusterRadius:
            50

        }
      );


      /*
       * ----------------------------------------------------
       * CLUSTER CIRCLES
       * ----------------------------------------------------
       */

      map.addLayer({

        id:
          "clusters",

        type:
          "circle",

        source:
          "events",

        /*
         * Only show features which MapLibre has
         * identified as clusters.
         */

        filter:
          ["has", "point_count"],

        paint: {

          /*
           * Cluster circle size increases according
           * to the number of events inside it.
           */

          "circle-radius": [

            "step",

            ["get", "point_count"],

            18,

            10,
            22,

            25,
            27,

            50,
            32

          ],


          /*
           * Cluster colour.
           */

          "circle-color": [

            "step",

            ["get", "point_count"],

            "#1976d2",

            10,
            "#1565c0",

            25,
            "#0d47a1"

          ],


          "circle-stroke-width":
            2,

          "circle-stroke-color":
            "#ffffff"

        }

      });


      /*
       * ----------------------------------------------------
       * CLUSTER NUMBER
       * ----------------------------------------------------
       */

map.addLayer({
  id: "cluster-count",
  type: "symbol",
  source: "events",
  filter: ["has", "point_count"],

  layout: {
    "text-field": "{point_count_abbreviated}",
    "text-font": ["Noto Sans Regular"],
    "text-size": 13,
    "text-allow-overlap": true
  },

  paint: {
    "text-color": "#ffffff"
  }
});


      /*
       * ----------------------------------------------------
       * INDIVIDUAL EVENTS
       * ----------------------------------------------------
       *
       * These are only visible when an event is
       * no longer inside a cluster.
       */

      map.addLayer({

        id:
          "unclustered-point",

        type:
          "circle",

        source:
          "events",

        filter: [
          "!",
          ["has", "point_count"]
        ],

        paint: {

          "circle-color":
            "#e53935",

          "circle-radius":
            7,

          "circle-stroke-width":
            2,

          "circle-stroke-color":
            "#ffffff"

        }

      });


      /*
       * ----------------------------------------------------
       * FIT MAP TO EVENTS
       * ----------------------------------------------------
       */

      if (features.length > 0) {

        const bounds =
          new maplibregl.LngLatBounds();


        for (const feature of features) {

          bounds.extend(
            feature.geometry.coordinates
          );

        }


map.fitBounds(
  UK_BOUNDS,
  {
    padding: 25
  }
);

      }


      /*
       * Update status
       */

      status.textContent =
        `${features.length} events currently shown`;

    }


    /*
     * ----------------------------------------------------
     * CLUSTER CLICK
     * ----------------------------------------------------
     *
     * Clicking a cluster automatically zooms to the
     * level where that cluster expands.
     */

map.on("click", "clusters", async (e) => {

  const features = map.queryRenderedFeatures(
    e.point,
    {
      layers: ["clusters"]
    }
  );

  if (!features.length) {
    return;
  }

   console.log(
    "Cluster clicked:",
    features[0].properties
  );

  const clusterId =
    features[0].properties.cluster_id;

  const source =
    map.getSource("events");

  const zoom =
    await source.getClusterExpansionZoom(
      clusterId
    );

  map.easeTo({
    center:
      features[0].geometry.coordinates,
    zoom:
      zoom
  });

});


    /*
     * ----------------------------------------------------
     * INDIVIDUAL EVENT CLICK
     * ----------------------------------------------------
     */

    map.on(
      "click",
      "unclustered-point",
      event => {

        const feature =
          event.features?.[0];


        if (!feature) {

          return;

        }


        const props =
          feature.properties;


        /*
         * Make a copy so coordinates can safely
         * be adjusted if required.
         */

        const coordinates =
          feature.geometry
            .coordinates
            .slice();


        /*
         * Handle repeated-world maps correctly.
         */

        while (
          Math.abs(
            event.lngLat.lng -
            coordinates[0]
          ) > 180
        ) {

          coordinates[0] +=
            event.lngLat.lng >
            coordinates[0]
              ? 360
              : -360;

        }


        /*
         * Format the event date
         */

        let formattedDate =
          "Date unavailable";


        if (props.start_datetime) {

          const parsedDate =
            new Date(
              props.start_datetime.replace(
                " ",
                "T"
              )
            );


          if (
            !Number.isNaN(
              parsedDate.getTime()
            )
          ) {

            formattedDate =
              parsedDate
                .toLocaleDateString(
                  "en-GB",
                  {

                    weekday:
                      "short",

                    day:
                      "numeric",

                    month:
                      "short",

                    year:
                      "numeric"

                  }
                );

          }

        }


        /*
         * Location string
         */

        let locationHtml = "";


        if (props.venue_name) {

          locationHtml += `

            <p>
              <strong>Venue:</strong>
              ${escapeHtml(
                props.venue_name
              )}
            </p>

          `;

        }


        if (
          props.city ||
          props.postcode
        ) {

          locationHtml += `

            <p>

              ${escapeHtml(
                props.city ?? ""
              )}

              ${
                props.city &&
                props.postcode
                  ? ", "
                  : ""
              }

              ${escapeHtml(
                props.postcode ?? ""
              )}

            </p>

          `;

        }


        /*
         * Cost
         */

        let costHtml = "";


        if (props.cost_text) {

          costHtml = `

            <p>
              <strong>Cost:</strong>
              ${escapeHtml(
                props.cost_text
              )}
            </p>

          `;

        }


        /*
         * Link back to the official British Judo
         * event page.
         */

        let linkHtml = "";


        if (props.bja_url) {

          linkHtml = `

            <a
              href="${escapeAttribute(
                props.bja_url
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              View event on British Judo
            </a>

          `;

        }


        const popupHtml = `

          <div class="event-popup">

            <h3>
              ${escapeHtml(
                props.title
              )}
            </h3>

            <p>
              <strong>Date:</strong>
              ${escapeHtml(
                formattedDate
              )}
            </p>

            ${locationHtml}

            ${costHtml}

            ${linkHtml}

          </div>

        `;


        new maplibregl.Popup({
          offset: 12
        })
          .setLngLat(
            coordinates
          )
          .setHTML(
            popupHtml
          )
          .addTo(
            map
          );

      }
    );


    /*
     * ----------------------------------------------------
     * CURSOR CHANGES
     * ----------------------------------------------------
     */


    map.on(
      "mouseenter",
      "clusters",
      () => {

        map.getCanvas().style.cursor =
          "pointer";

      }
    );


    map.on(
      "mouseleave",
      "clusters",
      () => {

        map.getCanvas().style.cursor =
          "";

      }
    );


    map.on(
      "mouseenter",
      "unclustered-point",
      () => {

        map.getCanvas().style.cursor =
          "pointer";

      }
    );


    map.on(
      "mouseleave",
      "unclustered-point",
      () => {

        map.getCanvas().style.cursor =
          "";

      }
    );


    /*
     * ----------------------------------------------------
     * HTML SAFETY FUNCTIONS
     * ----------------------------------------------------
     */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return escapeHtml(value);

    }


    /*
     * ----------------------------------------------------
     * START
     * ----------------------------------------------------
     *
     * Sources and layers can only be added once the
     * MapLibre style has finished loading.
     */

    map.on(
      "load",
      async () => {

        try {

          await loadEvents();

        }
        catch (error) {

          console.error(
            "Could not load events:",
            error
          );


          document
            .getElementById(
              "status"
            )
            .textContent =
              "Could not load events.";

        }

      }
    );

  </script>

</body>
</html>
